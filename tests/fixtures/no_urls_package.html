  <div class="package">
    <p>Xorg is a freedesktop.org implementation of the X Window System.</p>
    <p>This section has no package to download; it explains the build
       environment used by the rest of the chapter.</p>

    <p class="required">Required: <a class="xref" href="../general/util-macros.html"
       title="util-macros-1.19.3" shape="rect">util-macros-1.19.3</a></p>
  </div>

  <div class="installation">
    <pre class="userinput"><kbd class="command">export XORG_PREFIX="/usr"</kbd></pre>
  </div>
